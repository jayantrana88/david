# Keeps the deploy repo (the one the Deploy to Cloudflare button copies) equal to cloudflare/ here, with the
# Worker at its root. Edit cloudflare/ in this repo only; never edit the deploy repo by hand.
# One-time setup: create the empty public repo DEPLOY_REPO below, then add a repository secret DEPLOY_REPO_TOKEN:
# a fine-grained personal access token with "Contents: Read and write" on that repo only.
name: Sync Cloudflare deploy repo

on:
  push:
    branches: [main]
    paths: ["cloudflare/**", ".github/workflows/sync-cloudflare.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  DEPLOY_REPO: jayantrana88/david-cloudflare

jobs:
  sync:
    if: github.repository == 'jayantrana88/david'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.DEPLOY_REPO }}
          token: ${{ secrets.DEPLOY_REPO_TOKEN }}
          path: deploy
      - name: Copy cloudflare/ to the deploy repo's root
        run: |
          find deploy -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -C cloudflare --exclude=node_modules --exclude=.wrangler --exclude=.dev.vars -cf - . | tar -C deploy -xf -
      - name: Commit and push
        working-directory: deploy
        run: |
          git add -A
          if git diff --cached --quiet; then echo "Already up to date."; exit 0; fi
          git config user.name "david-sync[bot]"
          git config user.email "david-sync@users.noreply.github.com"
          git commit -m "Sync from ${{ github.repository }}@${GITHUB_SHA::7}"
          git push
